<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Transaction</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#474746",
                        "outline": "#747878",
                        "on-tertiary-container": "#7671ff",
                        "primary-fixed-dim": "#c8c6c5",
                        "tertiary-container": "#0f0069",
                        "inverse-primary": "#c8c6c5",
                        "on-surface-variant": "#444748",
                        "error": "#ba1a1a",
                        "surface-bright": "#fdf8f8",
                        "tertiary": "#000000",
                        "primary-fixed": "#e5e2e1",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#e3e2e2",
                        "primary-container": "#1c1b1b",
                        "surface-tint": "#5f5e5e",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#f4f0ef",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed": "#1b1c1c",
                        "inverse-surface": "#313030",
                        "surface-variant": "#e5e2e1",
                        "on-primary-fixed": "#1c1b1b",
                        "surface-container-high": "#ebe7e6",
                        "on-secondary-container": "#646464",
                        "outline-variant": "#c4c7c7",
                        "secondary-fixed-dim": "#c7c6c6",
                        "on-primary-container": "#858383",
                        "on-surface": "#1c1b1b",
                        "surface": "#fdf8f8",
                        "surface-dim": "#ddd9d8",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-background": "#1c1b1b",
                        "tertiary-fixed-dim": "#c3c0ff",
                        "on-secondary-fixed-variant": "#464747",
                        "primary": "#000000",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f7f3f2",
                        "on-tertiary-fixed-variant": "#3323cc",
                        "secondary": "#5e5e5e",
                        "surface-container-highest": "#e5e2e1",
                        "on-tertiary-fixed": "#0f0069",
                        "background": "#fdf8f8",
                        "tertiary-fixed": "#e2dfff",
                        "surface-container": "#f1edec",
                        "secondary-fixed": "#e3e2e2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "32px",
                        "stack-md": "16px",
                        "unit": "8px",
                        "stack-sm": "8px",
                        "container-padding": "24px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "display-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"],

                        "label-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["72px", { "lineHeight": "80px", "letterSpacing": "-0.04em", "fontWeight": "200" }],
                        "display-md": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "300" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],

                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #F9F9F8; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .filled-icon { font-variation-settings: 'FILL' 1; }
        
        /* Hide scrollbar for category grid */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary">
<!-- Top App Bar -->
<header class="flex justify-between items-center px-container-padding py-stack-md w-full bg-surface">
<div class="flex items-center gap-unit cursor-pointer hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-outline">arrow_back</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-medium text-primary text-center flex-1">Add transaction</h1>
<div class="w-6"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-container-padding pb-[100px] flex flex-col gap-stack-lg">
<!-- Amount Input -->
<section class="flex flex-col items-center justify-center py-stack-lg border-b border-outline-variant">
<input class="bg-transparent text-center font-display-md text-display-md text-primary border-none focus:ring-0 p-0 w-full outline-none" placeholder="₹ 0.00" type="text" value="₹ 0.00"/>
</section>
<!-- Segmented Toggle -->
<section class="flex bg-surface-container-high rounded-full p-1">
<button class="flex-1 py-2 rounded-full bg-surface-container-lowest shadow-sm font-label-md text-label-md text-primary transition-all">EXPENSE</button>
<button class="flex-1 py-2 rounded-full font-label-md text-label-md text-outline hover:text-on-surface transition-all">INCOME</button>
</section>
<!-- Categories Grid -->
<section class="flex flex-col gap-stack-md">
<h2 class="font-label-md text-label-md text-outline">Category</h2>
<div class="grid grid-cols-4 gap-unit">
<button class="flex flex-col items-center gap-2 p-3 rounded-lg border border-primary bg-surface-container-lowest transition-colors">
<span class="material-symbols-outlined text-primary">restaurant</span>
<span class="font-label-sm text-label-sm text-primary">Food</span>
</button>
<button class="flex flex-col items-center gap-2 p-3 rounded-lg border border-outline-variant bg-surface-container-lowest hover:border-outline transition-colors">
<span class="material-symbols-outlined text-outline">directions_car</span>
<span class="font-label-sm text-label-sm text-outline">Transport</span>
</button>
<button class="flex flex-col items-center gap-2 p-3 rounded-lg border border-outline-variant bg-surface-container-lowest hover:border-outline transition-colors">
<span class="material-symbols-outlined text-outline">shopping_bag</span>
<span class="font-label-sm text-label-sm text-outline">Shopping</span>
</button>
<button class="flex flex-col items-center gap-2 p-3 rounded-lg border border-outline-variant bg-surface-container-lowest hover:border-outline transition-colors">
<span class="material-symbols-outlined text-outline">receipt_long</span>
<span class="font-label-sm text-label-sm text-outline">Bills</span>
</button>
<button class="flex flex-col items-center gap-2 p-3 rounded-lg border border-outline-variant bg-surface-container-lowest hover:border-outline transition-colors">
<span class="material-symbols-outlined text-outline">favorite</span>
<span class="font-label-sm text-label-sm text-outline">Health</span>
</button>
<button class="flex flex-col items-center gap-2 p-3 rounded-lg border border-outline-variant bg-surface-container-lowest hover:border-outline transition-colors">
<span class="material-symbols-outlined text-outline">movie</span>
<span class="font-label-sm text-label-sm text-outline">Entertain</span>
</button>
<button class="flex flex-col items-center gap-2 p-3 rounded-lg border border-outline-variant bg-surface-container-lowest hover:border-outline transition-colors">
<span class="material-symbols-outlined text-outline">more_horiz</span>
<span class="font-label-sm text-label-sm text-outline">Other</span>
</button>
</div>
</section>
<!-- Input Fields -->
<section class="flex flex-col gap-stack-md">
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-outline">Payment Method</label>
<div class="flex items-center justify-between border-b border-outline-variant py-2 cursor-pointer hover:border-primary transition-colors">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline">credit_card</span>
<span class="font-body-md text-body-md text-on-surface">Axis Bank Credit Card</span>
</div>
<span class="material-symbols-outlined text-outline">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-outline">Date</label>
<div class="flex items-center border-b border-outline-variant py-2">
<input class="bg-transparent font-body-md text-body-md text-on-surface w-full outline-none border-none focus:ring-0 p-0" type="date"/>
</div>
</div>
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-outline">Merchant</label>
<input class="bg-transparent font-body-md text-body-md text-on-surface border-b border-outline-variant focus:border-primary w-full outline-none py-2 px-0 transition-colors" placeholder="e.g. Starbucks" type="text"/>
</div>
<div class="flex flex-col gap-unit">
<label class="font-label-sm text-label-sm text-outline">Note (Optional)</label>
<input class="bg-transparent font-body-md text-body-md text-on-surface border-b border-outline-variant focus:border-primary w-full outline-none py-2 px-0 transition-colors" placeholder="Add details..." type="text"/>
</div>
</section>
</main>
<!-- Footer CTA -->
<footer class="fixed bottom-0 left-0 w-full p-container-padding bg-surface-container-lowest border-t border-outline-variant">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-xl hover:opacity-90 active:scale-95 transition-all">
            Save transaction
        </button>
</footer>
</body></html>
