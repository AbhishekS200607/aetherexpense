<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

                        "gutter": "16px"
                    },
                    "fontFamily": {

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fdf8f8; /* surface */
        }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface text-primary font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg docked full-width top-0 bg-surface flat no shadows flex justify-between items-center px-container-padding py-stack-md w-full sticky z-40">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary hover:opacity-80 transition-opacity" data-icon="arrow_back">arrow_back</button>
<span class="font-display-md text-display-md font-light text-primary tracking-tight">Overview</span>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-primary hover:opacity-80 transition-opacity cursor-pointer" data-icon="search">search</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-container-padding py-stack-lg md:px-0 md:max-w-2xl md:mx-auto w-full">
<div class="mb-stack-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-unit">Your data</h1>
<div class="flex items-center gap-2 mt-stack-sm text-secondary">
<span class="material-symbols-outlined" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-md text-body-md">Stored on this device</span>
</div>
</div>
<!-- Bento Grid for Actions -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Export Backup -->
<button class="bg-surface-container-lowest border border-outline-variant rounded-xl p-container-padding flex flex-col items-start gap-stack-md hover:bg-surface-container-low transition-colors text-left group">
<div class="bg-surface-container h-12 w-12 rounded-full flex items-center justify-center group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-on-surface" data-icon="upload">upload</span>
</div>
<div>
<h3 class="font-label-md text-label-md text-on-surface mb-1">Export backup</h3>
<p class="font-body-md text-body-md text-secondary text-sm">Save a copy of your financial records securely.</p>
</div>
</button>
<!-- Import Backup -->
<button class="bg-surface-container-lowest border border-outline-variant rounded-xl p-container-padding flex flex-col items-start gap-stack-md hover:bg-surface-container-low transition-colors text-left group">
<div class="bg-surface-container h-12 w-12 rounded-full flex items-center justify-center group-hover:bg-primary-fixed transition-colors">
<span class="material-symbols-outlined text-on-surface" data-icon="download">download</span>
</div>
<div>
<h3 class="font-label-md text-label-md text-on-surface mb-1">Import backup</h3>
<p class="font-body-md text-body-md text-secondary text-sm">Restore your data from a previously saved file.</p>
</div>
</button>
<!-- Encrypted Backup (Spans full width on mobile, 2 cols on md) -->
<button class="md:col-span-2 bg-primary text-on-primary rounded-xl p-container-padding flex flex-row items-center justify-between hover:opacity-90 transition-opacity text-left">
<div class="flex flex-row items-center gap-stack-md">
<div class="bg-inverse-surface h-12 w-12 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary" data-icon="lock">lock</span>
</div>
<div>
<h3 class="font-label-md text-label-md text-on-primary mb-1">Create encrypted backup</h3>
<p class="font-body-md text-body-md text-inverse-primary text-sm">Password-protect your data export.</p>
</div>
</div>
<span class="material-symbols-outlined text-on-primary opacity-50" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<div class="mt-stack-lg border-t border-outline-variant pt-stack-md flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-outline text-sm" data-icon="shield">shield</span>
<p class="font-label-sm text-label-sm text-outline text-center uppercase tracking-widest">Your financial data stays on your device.</p>
</div>
</main>
<!-- BottomNavBar (Hidden on MD, suppressed intent rules applied based on context, assuming this is a settings sub-page, we suppress standard nav) -->
<!-- Suppressed: Task-Focused sub-page featuring a "Back" action implies a temporary departure from the main navigation flow. -->
</body></html>
