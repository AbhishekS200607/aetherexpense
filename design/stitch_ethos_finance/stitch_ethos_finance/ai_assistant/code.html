<body class="bg-surface text-on-surface min-h-screen flex flex-col pb-[80px]">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface text-primary dark:text-on-surface font-headline-lg-mobile text-headline-lg-mobile docked full-width top-0 bg-surface dark:bg-surface flat no shadows flex justify-between items-center px-container-padding py-stack-md w-full sticky z-50 top-0">
<div class="flex items-center gap-stack-md">
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="A sophisticated, minimalist portrait of a user in a clean, brightly lit professional environment, fitting for a premium financial app avatar." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAcEBr-iLTlaG0PmF9d4sHfwTfcoVR0OZSRoSAT9hG6OEX-cglXInjWpJ6EOwreN8D67xhT6JNpeWbllmWILvidJ2teTRXr8qD3HMqu1Ca4-9yR4UctyFRi--N3Ae-vwx8H2VXOmGJTTl1MdMvQD_shw1owW1i_8Pfsl6dtTmy8Fk4skFJiYJubRzqewmrC4kPx25O8JEfFjesTAIhy_UscQDPOZQUSz6cavj03yBpDeRPZunmufvn2"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tight">Overview</h1>
</div>
<button class="flex items-center justify-center p-unit hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-primary">search</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 px-container-padding py-stack-md flex flex-col gap-stack-lg max-w-2xl mx-auto w-full">
<!-- Assistant Heading & Toggle -->
<section class="flex flex-col gap-stack-md items-center">
<h2 class="font-display-md text-display-md font-light text-center">Assistant</h2>
<div class="flex bg-surface-container-highest p-1 rounded-full w-full max-w-[300px] border border-outline-variant">
<button class="flex-1 py-2 px-4 rounded-full font-label-md text-label-md bg-surface-container-lowest text-primary shadow-sm text-center transition-all">
                    OFFLINE INSIGHTS
                </button>
<button class="flex-1 py-2 px-4 rounded-full font-label-md text-label-md text-on-surface-variant text-center transition-all hover:text-primary">
                    ONLINE AI
                </button>
</div>
</section>
<!-- Chat Area -->
<section class="flex flex-col gap-stack-lg flex-1">
<!-- User Message -->
<div class="flex justify-end w-full">
<div class="bg-surface-container-high px-gutter py-stack-sm rounded-t-xl rounded-bl-xl rounded-br-sm border border-outline-variant max-w-[85%]">
<p class="font-body-md text-body-md text-on-surface">Where did I spend the most?</p>
</div>
</div>
<!-- AI Response (Insight Card) -->
<div class="flex flex-col gap-stack-sm w-full max-w-[90%]">
<div class="flex items-center gap-unit text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">robot_2</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">Analysis Complete</span>
</div>
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-container-padding flex flex-col gap-stack-md">
<div class="flex justify-between items-start">
<div class="flex flex-col gap-1">
<div class="flex items-center gap-unit">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[18px]">restaurant</span>
</div>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-[20px] font-medium leading-none">Food</h3>
</div>
<span class="font-label-md text-label-md text-on-surface-variant mt-2">Highest category this month</span>
</div>
<div class="text-right flex flex-col items-end">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-medium">₹2,450</span>
<span class="font-label-md text-label-md text-secondary mt-1">32% of total</span>
</div>
</div>
<!-- Minimalist bar chart representation -->
<div class="w-full h-1 bg-surface-container-high rounded-full overflow-hidden mt-unit">
<div class="h-full bg-primary w-[32%] rounded-full"></div>
</div>
</div>
</div>
</section>
<!-- Input Area -->
<section class="mt-auto pt-stack-md">
<div class="relative w-full">
<input class="w-full bg-transparent border-0 border-b border-outline-variant py-gutter px-0 font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-0 focus:border-primary transition-colors" placeholder="Ask about your finances..." type="text"/>
<button class="absolute right-0 top-1/2 -translate-y-1/2 p-unit text-primary hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined">send</span>
</button>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="bg-surface-container-lowest dark:bg-surface-container-lowest text-primary dark:text-on-surface font-label-sm text-label-sm fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-container-padding py-4 border-t border-outline-variant dark:border-outline shadow-sm rounded-t-xl hidden md:hidden flex">
<a class="flex flex-col items-center gap-1 text-outline dark:text-outline-variant hover:text-primary dark:hover:text-on-surface transition-colors" href="#">
<span class="material-symbols-outlined">home</span>
</a>
<a class="flex flex-col items-center gap-1 text-outline dark:text-outline-variant hover:text-primary dark:hover:text-on-surface transition-colors" href="#">
<span class="material-symbols-outlined">account_balance_wallet</span>
</a>
<a class="flex flex-col items-center gap-1 text-outline dark:text-outline-variant hover:text-primary dark:hover:text-on-surface transition-colors" href="#">
<span class="material-symbols-outlined">add_circle</span>
</a>
<!-- Active Tab: Analytics (closest to Insights/AI) -->
<a class="flex flex-col items-center gap-1 text-primary dark:text-on-surface scale-110 Active: scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined">analytics</span>
</a>
<a class="flex flex-col items-center gap-1 text-outline dark:text-outline-variant hover:text-primary dark:hover:text-on-surface transition-colors" href="#">
<span class="material-symbols-outlined">settings</span>
</a>
</nav>
